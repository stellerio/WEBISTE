<!DOCTYPE html>
<html>
<head>
<title>Steller AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>
<aside>
<h2>STELLER</h2>
<button>+ New Chat</button>
<div class="panel">Memory<br><span id="memory">0</span></div>
<div class="panel">Brain Status<br><span>ONLINE</span></div>
</aside>
<main>
<header>
<h1>Steller AI</h1>
<p>Private intelligence powered by local models + Steller Brain</p>
</header>
<div id="chat" class="chat"></div>
<div class="thinking" id="thinking">Steller is thinking...</div>
<div class="input-box">
<input id="input" placeholder="Ask Steller anything...">
<button onclick="ask()">Send</button>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
