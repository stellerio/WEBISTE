<!DOCTYPE html>
<html>
<head>
<title>Steller Core AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

        <h1>Steller <span>Core</span></h1>

<script src="app.js"></script>
</body>
</html>
